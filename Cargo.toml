[package]
name = "moon-dst"
version = "2026.1.0"
edition = "2021"
rust-version = "1.99"
description = "MoonBit dependency updater CLI"
license = "MIT"

[[bin]]
name = "moon-dst"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
anyhow = "1"
num_cpus = "1"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "trace"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
